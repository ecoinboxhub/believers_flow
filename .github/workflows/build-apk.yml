name: Build Signed APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Add native notification resources
        run: |
          mkdir -p frontend/android/app/src/main/res/drawable
          mkdir -p frontend/android/app/src/main/res/raw
          cp frontend/public/sounds/alarm.ogg frontend/android/app/src/main/res/raw/alarm.ogg
          cp mobile/app/src/main/res/drawable/ic_stat_believersflow.xml frontend/android/app/src/main/res/drawable/ic_stat_believersflow.xml
          cp mobile/app/src/main/res/raw/keep.xml frontend/android/app/src/main/res/raw/keep.xml

      - name: Copy Capacitor files to mobile project
        run: |
          cp -r frontend/android/capacitor-cordova-android-plugins mobile/capacitor-cordova-android-plugins
          cp frontend/android/capacitor.settings.gradle mobile/capacitor.settings.gradle
          cp frontend/android/app/capacitor.build.gradle mobile/app/capacitor.build.gradle
          mkdir -p mobile/app/src/main/assets
          cp frontend/android/app/src/main/assets/capacitor.plugins.json mobile/app/src/main/assets/capacitor.plugins.json
          mkdir -p mobile/app/src/main/assets/public
          rm -rf mobile/app/src/main/assets/public/*
          cp -r frontend/android/app/src/main/assets/public/* mobile/app/src/main/assets/public/
          cp -r frontend/android/app/src/main/res/drawable/ic_stat_believersflow.xml mobile/app/src/main/res/drawable/ic_stat_believersflow.xml
          cp -r frontend/android/app/src/main/res/raw/ mobile/app/src/main/res/raw/

      - name: Link node_modules for Gradle
        run: ln -s frontend/node_modules node_modules

      - name: Check release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASSWORD must be set."
            echo "Without them the build would generate a brand-new signing key, and every"
            echo "release would be signed differently - users could never install an update"
            echo "over an existing install. See docs/KEYSTORE_ROTATION.md."
            exit 1
          fi
          echo "release signing secrets present"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > mobile/app/app-release.jks
          ls -l mobile/app/app-release.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build signed APK
        env:
          BF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd mobile
          gradle assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK_PATH="mobile/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            find mobile/app/build/outputs -type f 2>/dev/null || echo "Build output directory does not exist"
            exit 1
          fi
          echo "APK found: $(wc -c < "$APK_PATH") bytes"
          if ! unzip -l "$APK_PATH" | grep -q "assets/capacitor.plugins.json"; then
            echo "ERROR: assets/capacitor.plugins.json missing from APK - native plugins will not register"
            exit 1
          fi
          echo "assets/capacitor.plugins.json present in APK"

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          APK_PATH="mobile/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          ACTUAL=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK_PATH" \
                  | awk '/certificate SHA-256 digest/ {print $NF}')
          echo "signing cert SHA-256: $ACTUAL"
          if [ -n "$EXPECTED_CERT_SHA256" ] && [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match the pinned release certificate."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL"
            echo "This means the signing key changed. Confirm it was an intentional rotation."
            exit 1
          fi

      - name: Check APK payload for non-shipping assets
        run: |
          APK_PATH="mobile/app/build/outputs/apk/release/app-release.apk"
          if unzip -l "$APK_PATH" | grep -qiE 'assets/public/(UI|UI icons)/'; then
            echo "::error::design sources under public/ are being packaged into the APK"
            exit 1
          fi
          echo "APK size: $(du -h "$APK_PATH" | cut -f1)"
          echo "no design sources packaged"

      - name: Prepare release asset
        run: cp mobile/app/build/outputs/apk/release/app-release.apk BelieversFlow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: believersflow-release
          path: BelieversFlow.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "BelieversFlow ${{ github.ref_name }}"
          body: |
            ## BelieversFlow ${{ github.ref_name }}

            Download and install `BelieversFlow.apk` on your Android device.

            **Permanent download:** [BelieversFlow.apk](https://github.com/ecoinboxhub/believers_flow/releases/latest/download/BelieversFlow.apk)

            See [CHANGELOG.md](https://github.com/ecoinboxhub/believers_flow/blob/main/CHANGELOG.md) for details.
          files: BelieversFlow.apk
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          make_latest: true
