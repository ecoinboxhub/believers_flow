apply plugin: 'com.android.application'

def RELEASE_KEYSTORE_PASSWORD = 'BF_S1gnKey_2026!'

task ensureReleaseKeystore {
    def ksFile = file('app-release.jks')
    outputs.file(ksFile)
    doLast {
        if (!ksFile.exists()) {
            def isWin = System.getProperty('os.name').toLowerCase().contains('win')
            def keytool = System.getProperty('java.home') + File.separator + 'bin' + File.separator + (isWin ? 'keytool.exe' : 'keytool')
            project.exec {
                commandLine keytool, '-genkeypair', '-v',
                    '-keystore', ksFile.absolutePath,
                    '-alias', 'believersflow',
                    '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000',
                    '-storepass', RELEASE_KEYSTORE_PASSWORD,
                    '-keypass', RELEASE_KEYSTORE_PASSWORD,
                    '-dname', 'CN=BelieversFlow, OU=Development, O=BelieversFlow, L=Unknown, ST=Unknown, C=NG'
            }
        }
    }
}

android {
    namespace = "com.believersguidelite.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.believersguidelite.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
versionCode 23
versionName "4.22.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file('app-release.jks')
            storePassword RELEASE_KEYSTORE_PASSWORD
            keyAlias 'believersflow'
            keyPassword RELEASE_KEYSTORE_PASSWORD
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

afterEvaluate {
    preBuild.dependsOn ensureReleaseKeystore
}

apply from: 'capacitor.build.gradle'
